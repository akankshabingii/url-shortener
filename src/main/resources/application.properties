spring.application.name=url-shortener
server.port=8080

# Which profile runs when you don't pick one
spring.profiles.default=dev

# Flyway owns the schema; Hibernate only verifies it matches the entities
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Redirect cache (Redis, used in every profile)
spring.cache.type=redis
spring.cache.cache-names=links
spring.cache.redis.time-to-live=20m
spring.cache.redis.cache-null-values=false
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
app.click-flush-ms=5000

# Rate limiting (per client IP, per minute)
app.rate-limit.enabled=true
app.rate-limit.create-per-minute=10
app.rate-limit.read-per-minute=120

spring.web.resources.add-mapping=true