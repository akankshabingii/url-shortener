spring.application.name=url-shortener
server.port=8080

# Which profile runs when you don't pick one
spring.profiles.default=dev

# Flyway owns the schema; Hibernate only verifies it matches the entities
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Redirect cache + click batching
spring.cache.cache-names=links
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=10m
app.click-flush-ms=5000